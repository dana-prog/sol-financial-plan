<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { margin: 0; padding: 16px 20px; box-sizing: border-box; font: 14px Arial, sans-serif; color: #202124; }
    .status { display: flex; align-items: flex-start; gap: 14px; }
    #spinner { width: 24px; height: 24px; flex: 0 0 24px; border: 3px solid #dadce0;
      border-top-color: #202124; border-radius: 50%; animation: spin 1s linear infinite; }
    p { line-height: 1.5; margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .actions { margin-top: 16px; }
    .actions { text-align: right; }
    button { border: 0; border-radius: 4px; padding: 8px 22px; background: #1a73e8;
      color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #174ea6; outline-offset: 3px; }
    [hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #spinner { animation: none; } }
  </style>
</head>
<body>
  <div role="status" aria-live="polite">
    <div class="status">
      <div id="spinner" aria-hidden="true"></div>
      <p id="message"><?= action ?></p>
    </div>
  </div>
  <div class="actions"><button id="close" hidden>OK</button></div>
  <script>
    function finish(message) {
      document.getElementById('spinner').hidden = true;
      document.getElementById('message').textContent = message;
      const close = document.getElementById('close');
      close.hidden = false;
      requestAnimationFrame(() => {
        google.script.host.setHeight(Math.max(160, document.body.scrollHeight));
        close.focus({preventScroll: true});
      });
    }
    document.getElementById('close').addEventListener('click', () => google.script.host.close());
    // Let the browser paint the spinner before starting the server operation.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      google.script.run
        .withSuccessHandler(finish)
        .withFailureHandler(error => finish(error.message || String(error)))
        .recalculateIncomingLoanRepayments();
    }));
  </script>
</body>
</html>
