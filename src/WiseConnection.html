<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { margin: 0; padding: 22px; font: 14px Arial, sans-serif; color: #202124; }
    p { line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    select, input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; border: 1px solid #dadce0; border-radius: 4px; }
    button { padding: 10px 16px; margin: 16px 8px 0 0; border: 0; border-radius: 4px; font: inherit; cursor: pointer; background: #e8eaed; }
    #sync { background: #1a73e8; color: white; }
    button:disabled { opacity: .55; cursor: default; }
    #status { padding: 12px; background: #f1f3f4; border-radius: 4px; overflow-wrap: anywhere; }
    .hint { color: #5f6368; font-size: 12px; }
  </style>
</head>
<body>
  <p>Import current balances and statement transactions into <b>Wise Balances</b> and <b>Wise Transactions</b>.</p>
  <label for="profile">Business profile</label>
  <select id="profile" disabled></select>
  <label for="start">Import history from (UTC)</label>
  <input id="start" type="date" value="2026-01-01" disabled>
  <p class="hint">Each refresh rechecks the selected period through today, including corrections. Choose an earlier date to import older history. The API key stays in Script Properties.</p>
  <div>
    <button id="sync" disabled>Sync now</button>
    <button id="schedule" disabled>Enable daily refresh</button>
  </div>
  <p id="status" role="status" aria-live="polite">Checking Wise connection…</p>
  <script>
    let automatic = false;
    const profile = document.getElementById('profile');
    const start = document.getElementById('start');
    const sync = document.getElementById('sync');
    const schedule = document.getElementById('schedule');
    const status = document.getElementById('status');
    function busy(value) { [profile, start, sync, schedule].forEach(control => control.disabled = value); }
    function failed(error) { status.textContent = error.message || String(error); busy(false); }
    function done(message) { status.textContent = message; busy(false); }
    google.script.run.withSuccessHandler(state => {
      state.profiles.forEach(item => {
        const option = document.createElement('option'); option.value = item.id; option.textContent = item.name; profile.appendChild(option);
      });
      profile.value = state.profileId;
      start.value = state.startDate;
      automatic = state.automatic;
      schedule.textContent = automatic ? 'Disable daily refresh' : 'Enable daily refresh';
      done(state.lastSync ? 'Last successful sync: ' + new Date(state.lastSync).toLocaleString() : 'Connected. Choose Sync now to import your data.');
    }).withFailureHandler(error => { status.textContent = error.message || String(error); }).getWiseConnectionState();
    sync.addEventListener('click', () => {
      busy(true); status.textContent = 'Reading balances and transaction history from Wise…';
      google.script.run.withSuccessHandler(done).withFailureHandler(failed)
        .syncWiseAccount({profileId: profile.value, startDate: start.value});
    });
    schedule.addEventListener('click', () => {
      busy(true); status.textContent = 'Updating daily refresh…';
      const runner = google.script.run.withSuccessHandler(message => {
        automatic = !automatic;
        schedule.textContent = automatic ? 'Disable daily refresh' : 'Enable daily refresh'; done(message);
      }).withFailureHandler(failed);
      if (automatic) runner.disableWiseDailySync(); else runner.enableWiseDailySync();
    });
  </script>
</body>
</html>
